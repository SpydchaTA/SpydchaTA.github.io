<!DOCTYPE html>
    <head>
        <title>Astryx sports</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="icon" type="image/png" href="imagenes/asylogo.jpg">
    </head>
    <header>
        <div class="header">
            <div class="titulo">
                <img src="imagenes/asylogo.jpg" alt="astryx logo">
                <h1>Astryx ASY</h1>
            </div>
            <div class="nav">
                <a href="index.html" id="menu">Menu</a>
                <a href="team.html" id="team" style="text-decoration: underline">Team</a>
                <a href="cine.html" id="cine">Cine</a>
            </div>
        </div>
    </header>
    <body>
        <div class="container">
            <div class="integrantes">
                <div class="integrante-1" id="integrante">
                    <img src="imagenes/kyarix.png" alt="Kyarix">
                    <p>KYARIX</p>
                    <div class="agente">
                        <img src="imagenes/chamber.png" id="chamber" alt="">
                    </div>
                    <div class="rol">
                        <img src="imagenes/flex.png" alt="">
                    </div>
                </div>
                <div class="integrante-2" id="integrante">
                    <img src="imagenes/ADA.png" alt="ADA">
                    <p>ADA</p>
                    <div class="agente">
                        <img src="imagenes/omen.png" id="omen" alt="">
                    </div>
                    <div class="rol">
                        <img src="imagenes/controlador.png" alt="">
                    </div>
                </div>
                <div class="integrante-3" id="integrante">
                    <img src="imagenes/nebu.png" alt="nebu">
                    <p>Nebu</p>
                    <div class="agente">
                        <img src="imagenes/sova.png" id="sova" alt="">
                    </div>
                    <div class="rol">
                        <img src="imagenes/iniciador.png" alt="">
                    </div>
                </div>
            </div>
        </div>
    </body>
    <style>
        body {
            min-height: 150vh; 
            background: linear-gradient(to bottom right, rgb(0, 0, 0)30%, rgb(74, 2, 87));
            background-repeat: no-repeat;
            background-size: cover;
        }
        body::-webkit-scrollbar {
            width: 0;
        }
        #integrante {
            position: relative;
            display: inline-block;
        }
        .integrantes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 17%;
        }
        .integrantes #integrante {
            margin-left: 50px;
            margin-top: 90px;
            background: linear-gradient(rgb(212, 0, 255), rgb(14, 0, 95));
            max-width: 300px;
            padding: 10px;
            text-align: center;
            font-size: 30px;
            border-radius: 10px;
        }
        .integrantes img {
            height: 300px;
            box-shadow: 0 0 4px black;
        }
        .agente {
            position: absolute;
            top: 0;
            left: 100%;
            transform: translateX(-100%);
        }
        .agente img {
            width: 80px;
            height: auto;
            border: 2px solid white;
        }
        .rol {
            position: absolute;
            top: 90%;
            left: 2%;
        }
        .rol img {
            width: 40px;
            height: auto;
            box-shadow: none;
        }
    </style>
