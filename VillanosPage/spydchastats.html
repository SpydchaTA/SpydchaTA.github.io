<!DOCTYPE html>
    <head>
        <title>Spydcha_TA Stats</title>
        <link rel="icon" href="imagenes/logovillanospage.png">
    </head>
    <body>
        <video autoplay muted loop id="myVideo">
            <source src="imagenes/spydchafondovideo.mp4" type="video/mp4">
        </video>
        <div class="titulos">
            <h1>Spydcha_TA Stats</h1>
        </div>
        <div>
            <h2>Nivel de pvp: 80%</h2>
            <progress value="80" max="100"></progress>
        </div>
        <div>
            <h2>Uso de pp items: 70%</h2>
            <progress value="70" max="100"></progress>
        </div>
        <div>
            <h2>Nivel de actividad: 100%</h2>
            <progress value="100" max="100"></progress>
        </div>
        <div>
            <h2>Nivel de liderazgo: 88%</h2>
            <progress value="88" max="100"></progress>
        </div>
        <div>
            <a href="usuarios.html" id="boton">Volver</a>
        </div>
    </body>
    <style>
        div {
            display: flex;
            align-items: center;
            gap: 40px;
        }
        #myVideo {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            z-index: -1;
        }
        body {
            background: black;
            background-repeat: no-repeat;
            background-size: cover;
            background-size: 140%;
            background-position: left top;
            color: white;
            text-align: center;
            font-size: 25px;
            margin: 50px;
        }
        progress {
            width: 260px;
            height: 30px;
            appearance: none;
        }
        progress::-webkit-progress-bar {
            background-color: rgb(0, 0, 0);
            box-shadow: 0 0 20px rgb(255, 255, 255);
            border-radius: 10px;
        }
        progress::-webkit-progress-value {
            background-color: rgb(255, 0, 0);
            border-radius: 10px;
            box-shadow: 0 0 20px rgb(97, 0, 0);
        }
        #boton {
            background: linear-gradient(rgb(112, 0, 112), rgb(46, 0, 0));
            color: white;
            height: 50px;
            width: 160px;
            border: 0px;
            border-radius: 10%;
            text-decoration: none;
            position: absolute;
            left: 5%;
            top: 90%;
            font-size: 40px;
            transform: scale(1.05);
        }
    </style>
