<!DOCTYPE html>
    <head>
        <title>Suha Launcher - noticias</title>
        <link rel="stylesheet" href="../styles.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="icon" type="image/png" href="../imagenes/nuevologo.png">
    </head>
    <header>
        <div class="nav">
            <a href="../"><i class="bi bi-house-door"></i> Menu</a>
            <a href="../noticias/" style="background-color: rgb(44, 76, 184); border-radius: 10px;"><i class="bi bi-newspaper"></i> Noticias</a>
            <a href="https://discord.gg/CHQWkU4Z6N"><i class="bi bi-box-arrow-up-right"></i> Soporte</a>
        </div>
    </header>
    <body>
        <h1>Noticias y notas de versión</h1>
        <i class="bi bi-funnel-fill"></i>
        <input type="checkbox" id="ocultar-n">
        <label for="ocultar-n" id="ocultar">Ocultar noticias</label>
        <input type="checkbox" id="ocultar-v">
        <label for="ocultar-v" id="ocultar">Ocultar versiones</label>
        <div class="todo">
            <div class="versiones">
                <div class="version-2-1-0" id="version">
                    <img src="../imagenes/modloaders.png" alt="">
                    <a href="../versiones/v2-1-0.html">Versión 2.1.0 - Más Modloaders para el servidor</a>
                    <span style="background-color: red; min-width: 30%; padding: 3px; padding-right: 40%; padding-left: 40%; justify-self: right; border-radius: 0px; position: relative; top: 4px;">Novedad</span>
                </div>
            </div>
            <div class="noticias">
                <div class="noticia" id="noticia">
                    <img src="../imagenes/nuevologosinfondo.png" alt="">
                    <a href="../versiones/noticia140726.html">Nuevo logo para el launcher</a>
                </div>
            </div>
            <div class="versiones">
                <div class="version-2-0-0" id="version">
                    <img src="../imagenes/launcher2.png" alt="">
                    <a href="../versiones/v2-0-0.html">Version 2.0.0, nuevo diseño, clores y versiones</a>
                </div>
            </div>
            <div class="noticias">
                <div class="noticia" id="noticia">
                    <img src="../imagenes/Z HARDCORE.png" alt="">
                    <a href="../versiones/noticia070726.html">Nuevo servidor en camino</a>
                </div>
            </div>
            <div class="versiones">
                <div class="version-1-1-0" id="version">
                    <img src="../imagenes/launcherimagen.png" alt="">
                    <a href="../versiones/v1-1-0.html">Version 1.1.0, nuevas opciones, cambios graficos y funciones</a>
                </div>
            </div>
        </div>
    </body>
    <style>
        body::-webkit-scrollbar {
            width: 0;
        }
        body {
            background: linear-gradient(to right bottom, rgb(0, 0, 0) 30%, rgb(0, 23, 24));
            background-repeat: no-repeat;
            min-height: 100vh;
        }
        .todo {
            display: grid;
            gap: 60px;
            grid-template-columns: repeat(3, 1fr);
        }
        .versiones a {
            color: white;
            text-decoration: none;
            font-size: 30px;
            display: block;
            margin-top: 10px;
        }
        .noticias a {
            color: white;
            text-decoration: none;
            font-size: 30px;
            display: block;
            margin-top: 30px;
        }
        .versiones img {
            max-width: 100%;
            min-width: 100%;
            justify-self: center;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            background-color: rgb(54, 54, 54);
        }
        .noticias img {
            max-width: 100%;
            min-width: 100%;
            justify-self: center;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            background-color: rgb(44, 44, 44);
        }
        #noticia {
            background-color: rgba(128, 128, 128, 0);
            border: 4px solid rgb(77, 77, 77);
            border-radius: 20px;
            background-color: rgba(0, 0, 0, 0.801);
            background-blend-mode: darken;
            background-position: center;
            text-align: center;
            justify-content: center;
            padding: 4px;
            min-height: 470px;
            transition: all ease 0.2s;
        }
        #version {
            background-color: rgba(128, 128, 128, 0);
            border: 4px solid rgb(63, 63, 63);
            border-radius: 20px;
            background-color: rgba(0, 0, 0, 0.801);
            background-blend-mode: darken;
            background-position: center;
            text-align: center;
            justify-content: center;
            padding: 2px;
            padding-bottom: 30px;
            min-height: 450px;
            transition: all ease 0.2s;
        }
        #version:hover {
            border: 4px solid rgb(0, 125, 129);
            transition: all ease 0.2s;
        }
        #noticia:hover {
            border: 4px solid rgb(25, 0, 255);
            transition: all ease 0.3s;
        }
        #version,#noticia {
            margin-bottom: 20px;
        }
        #ocultar-n:checked ~ .todo .noticias {
            display: none;

        }
        #ocultar-v:checked ~ .todo .versiones {
            display: none;
        }
        label {
            color: white;
            position: relative;
            top: -5px;
            right: 10px;
            font-family: Arial, Helvetica, sans-serif;
        }
        input[type="checkbox"] {
            appearance: none;
            width: 20px;
            height: 20px;
            margin-right: 10px;
            border: 2px solid white;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        input[type="checkbox"]:checked {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid white;
            cursor: pointer;
            background-color: rgb(32, 190, 143);
            box-shadow: 0 0 20px rgb(32, 190, 143);
        }
        @media (max-width: 1000px) {
            .todo {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
            }
            .versiones {
                max-width: 100%;
            }
            .noticias {
                max-width: 100%;
            }
        }
    </style>
